[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodtake-studio"
version = "0.1.0"
description = "Local-first podcast clips with complete ideas, expressive captions, and checks on the finished file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "1aday"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.8,<3", "python-multipart>=0.0.20,<1", "Pillow>=10.4,<13", "psutil>=6,<8"
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2"]
youtube = ["yt-dlp>=2026.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
goodtake = "goodtake.cli:main"

[project.urls]
Repository = "https://github.com/1aday/goodtake"
Issues = "https://github.com/1aday/goodtake/issues"

[tool.hatch.build.targets.wheel]
packages = ["goodtake"]

[tool.hatch.build]
exclude = ["node_modules", "__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]

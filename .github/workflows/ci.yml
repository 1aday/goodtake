name: Check Goodtake
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: goodtake/renderer/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check .
      - run: npm ci --prefix goodtake/renderer
      - run: npm run typecheck --prefix goodtake/renderer
      - run: node --check goodtake/web/app.js
      - run: python -m build
      - name: Check wheel contains the app, renderer and sample
        run: python scripts/check-wheel.py
